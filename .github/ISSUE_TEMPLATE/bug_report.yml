name: Bug Report
description: Report an issue or unexpected behavior
title: "State the problem in a short title"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the firmware behavior and how to reproduce it.

  - type: input
    id: version
    attributes:
      label: Affected Version
      description: Enter the firmware version or commit SHA.
      placeholder: v1.2.3 or commit SHA
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Describe the Bug
      description: Describe what the device does.
      placeholder:
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: List the actions that reproduce the problem.
      placeholder: |
        1. Open '...'.
        2. Select '...'.
        3. State the observed result.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: Describe what the device must do instead.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output/Screenshots
      description: Add relevant error messages and logs. Attach screenshots if they show the problem.
      render: shell
